# Tests every push/PR. Publishes to npm when:
#   - a push to master/main carries a package.json version that isn't on npm yet
#     (bump the version, commit, push — nothing else to do; the vX.Y.Z tag is created for you), or
#   - a GitHub release is created (manual path, still supported).
# Pushes that don't change the version only run the tests.
name: Node.js Package

on:
  release:
    types: [created]
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  publish-npm:
    if: github.event_name == 'release' || github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the vX.Y.Z tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Publish if this version isn't on npm yet
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — skipping publish."
            exit 0
          fi
          npm publish
          if [ "${{ github.event_name }}" = "push" ] && ! git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
